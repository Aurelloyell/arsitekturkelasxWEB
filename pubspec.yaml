name: arsitektur_x_web
description: "Web version of ARsitektur X"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Web & Network
  web: ^1.1.1
  http: ^1.2.1
  
  # UI & Features
  model_viewer_plus: ^1.10.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gambar/cp1/
    - assets/gambar/cp2/Jalan/
    - assets/gambar/cp2/Jembatan/
    - assets/gambar/cp2/Perkerasan_Jalan/
    - assets/gambar/cp2/Umum/
    - assets/glb/cp1/