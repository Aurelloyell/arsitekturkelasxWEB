<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Aplikasi pembelajaran arsitektur ARsitektur X dengan materi, kuis, dan model 3D untuk gambar kerja, jalan, jembatan, dan perkerasan jalan.">
  <meta name="theme-color" content="#46178F">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ARsitektur X">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ARsitektur X Web</title>
  <link rel="manifest" href="manifest.json">

  <!-- model-viewer that ships with the model_viewer_plus package. The package
       injects <model-viewer> markup on web, so the custom element must be
       registered by the host page. Using the bundled copy keeps the script
       version in sync with the Dart package instead of pinning a CDN. -->
  <script type="module" src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>

  <!-- Robust Web Audio Synthesis Engine for ARsitektur X UI Effects -->
  <script>
    (function() {
      let audioCtx = null;
      let hasUnlocked = false;

      function getContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        return audioCtx;
      }

      function unlockAudio() {
        if (hasUnlocked && audioCtx && audioCtx.state === 'running') return;
        const ctx = getContext();
        if (ctx) {
          if (ctx.state === 'suspended') {
            ctx.resume().then(() => {
              hasUnlocked = true;
            }).catch(() => {});
          } else if (ctx.state === 'running') {
            hasUnlocked = true;
          }
        }
      }

      // Unlock on ANY user gesture (pointerdown, click, touch, keydown)
      window.addEventListener('pointerdown', unlockAudio, { passive: true, capture: true });
      window.addEventListener('click', unlockAudio, { passive: true, capture: true });
      window.addEventListener('touchstart', unlockAudio, { passive: true, capture: true });
      window.addEventListener('keydown', unlockAudio, { passive: true, capture: true });

      window.playUiSound = function(type) {
        try {
          const ctx = getContext();
          if (!ctx) return;
          if (ctx.state === 'suspended') {
            ctx.resume();
          }

          const t = ctx.currentTime;

          if (type === 'click') {
            // Crisp, satisfying tactile click / pop
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(540, t);
            osc.frequency.exponentialRampToValueAtTime(140, t + 0.07);

            gain.gain.setValueAtTime(0.35, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.08);
          } else if (type === 'hover') {
            // High-tech subtle chirp
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, t);
            osc.frequency.exponentialRampToValueAtTime(560, t + 0.04);

            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.045);
          } else if (type === 'chime' || type === 'success') {
            // Celebratory 3-note harmonic chord (C5 -> E5 -> G5)
            const notes = [523.25, 659.25, 783.99];
            notes.forEach((freq, idx) => {
              const noteTime = t + (idx * 0.09);
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, noteTime);

              gain.gain.setValueAtTime(0.28, noteTime);
              gain.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.18);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(noteTime);
              osc.stop(noteTime + 0.20);
            });
          }
        } catch(e) {
          console.warn('[ARsitektur X Audio]', e);
        }
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
